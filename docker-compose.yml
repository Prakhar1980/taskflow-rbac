services:
  mongodb:
    image: mongo:7
    container_name: rbac_tasks_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: rbac_tasks_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: rbac_tasks_backend
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      API_VERSION: v1
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb://mongodb:27017/rbac_tasks
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change_this_access_secret_for_production
      JWT_REFRESH_SECRET: change_this_refresh_secret_for_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      CACHE_TTL_SECONDS: 60

  frontend:
    build:
      context: ./frontend
    container_name: rbac_tasks_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data:
